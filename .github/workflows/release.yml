name: release

on:
  workflow_dispatch: {}
  schedule:
    - cron: '50 5 * * 2-6'  # 05:50 UTC, Tue-Sat morning (21:50 PST / 22:50 PDT Mon-Fri night)

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      PKG_VERSION: ${{ steps.version.outputs.PKG_VERSION }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Release version and notes
        id: version
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          # Version format: vYYYYMMDD.HHMMSS or vYYYYMMDD.HHMMSS-FORKOWNER.dawn.BRANCHNAME
          VERSION_DATETIME=$(git show -s --date=format:'%Y%m%d.%H%M%S' --format=%cd)
          VERSION_SUFFIX=${REPOSITORY/\//.}.${GITHUB_REF_NAME}
          if [[ "$VERSION_SUFFIX" != "google.dawn.main" ]]; then
            PKG_VERSION=v${VERSION_DATETIME}-${VERSION_SUFFIX}
          else
            PKG_VERSION=v${VERSION_DATETIME}
          fi
          echo "PKG_VERSION=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          printf 'Dawn release %s at revision %s.\n' "$PKG_VERSION" "$(git rev-parse HEAD)" > RELEASE_INFO.md
      - name: Upload release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-info
          path: RELEASE_INFO.md

  build-native:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [version, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Display Downloaded Files
        run: |
          mv artifacts/release-info/RELEASE_INFO.md .
          ls -R artifacts

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.version.outputs.PKG_VERSION }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --repo ${{ github.repository }} \
            --notes-file RELEASE_INFO.md \
            artifacts/Dawn-*/Dawn-*.tar.gz \
            artifacts/dawn-android-*/dawn-android-*.tar.gz \
            artifacts/dawn-apple-*/dawn-apple-*.xcframework.tar.gz \
            artifacts/dawn-headers-*/dawn-headers-*.tar.gz

  alert-on-failure:
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ failure() }}
    steps:
      - name: Alert on failure
        run: |
          curl -X POST \
            -H 'Content-Type: application/json; charset=UTF-8' \
            -d '{"text": "Release failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            '${{secrets.GARDENING_CHAT_WEBHOOK_URL}}'
