name: Native source boundary

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reject browser, Node, wire, and GN source reintroduction
        shell: bash
        run: |
          set -euo pipefail
          removed_paths=(
            src/emdawnwebgpu third_party/emdawnwebgpu
            src/dawn/node src/dawn/wire include/dawn/wire
            src/utils/chromium_test_compat
            webgpu-cts third_party/webgpu-cts scripts/dawn_node_cts
            build_overrides infra
            third_party/v8 third_party/node third_party/emscripten
            third_party/catapult third_party/depot_tools third_party/perfetto
            third_party/placeholder_chromium
            tools/clang tools/mb tools/gn
            tools/src/cov/server.go tools/src/cov/view-coverage.html
          )
          for path in "${removed_paths[@]}"; do
            if test -n "$(git ls-files -- "$path")"; then
              echo "Removed browser/Chromium source returned: $path" >&2
              exit 1
            fi
          done
          if git grep -n -E 'chromium_test_compat|SubstituteChromiumArgs|ChromePerfReporter|use_chrome_perf_format|--use-chrome-perf-format|--test-launcher-summary-output=' -- src; then
            echo 'Retired Chromium test/perf entry point returned' >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)BUILD\.gn$|\.gni$|(^|/)\.gn$'; then
            echo 'Removed Chromium GN build files returned' >&2
            exit 1
          fi
      - name: Reject removed browser-specific texture queue API
        shell: bash
        run: |
          set -euo pipefail
          for removed in \
            src/dawn/native/CopyTextureForBrowserHelper.cpp \
            src/dawn/native/CopyTextureForBrowserHelper.h \
            src/dawn/tests/end2end/CopyTextureForBrowserTests.cpp \
            src/dawn/tests/end2end/CopyExternalTextureForBrowserTests.cpp \
            src/dawn/tests/unittests/validation/CopyTextureForBrowserTests.cpp; do
            test ! -e "$removed"
          done
          if git grep -n -E 'CopyTextureForBrowser|CopyExternalTextureForBrowser|copy texture for browser|copy external texture for browser' -- src/dawn/dawn.json src/dawn/native src/dawn/tests; then
            echo 'Browser-only texture copy API was reintroduced' >&2
            exit 1
          fi
      - name: Exercise browser-extension removal and native texture contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/native_build_test.py RemovedBrowserTextureApiTest
      - name: Reject leftover wire and WebView generator metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile generator/dawn_json_parsing.py
          python3 tools/native_build_test.py RemovedWireSchemaTest
      - name: Verify native strict adapter mode and legacy compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/native_build_test.py NativeAdapterLimitModeTest
      - name: Preserve native CMake build and Emscripten refusal
        shell: bash
        run: |
          set -euo pipefail
          test -f src/dawn/native/CMakeLists.txt
          test -f src/tint/CMakeLists.txt
          grep -qF 'include(DawnNativeOnly)' CMakeLists.txt
          grep -qF 'Browser builds (Emscripten, emdawnwebgpu) were removed from this fork' src/cmake/DawnNativeOnly.cmake
